<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Rounded Forest Green Emblem Background -->
  <rect width="64" height="64" rx="14" fill="#123C2A" />
  
  <!-- Subtle Adventure Yellow Border Accent -->
  <rect x="1" y="1" width="62" height="62" rx="13" fill="none" stroke="#FFD429" stroke-width="1.2" stroke-opacity="0.3" />

  <!-- Golden Sun in Adventure Yellow (#FFD429) -->
  <circle cx="45" cy="16" r="8" fill="#FFD429" />

  <!-- Mountain Silhouette in Warm Ivory (#F7F4E9) -->
  <!-- Secondary background peak -->
  <polygon points="32,42 42,22 54,42" fill="#E2DBC9" />

  <!-- Main peak sunlit facet (Warm Ivory #F7F4E9) -->
  <polygon points="23,14 44,42 24,42" fill="#F7F4E9" />

  <!-- Main peak shadowed facet (Shaded Ivory) -->
  <polygon points="23,14 24,42 8,42" fill="#DCD5C3" />

  <!-- Rolling Foothill Terrain Base (Forest Green #123C2A) -->
  <path d="M 0,40 Q 32,37 64,40 L 64,64 L 0,64 Z" fill="#123C2A" />

  <!-- Winding S-shaped Mountain Road in Adventure Yellow (#FFD429) -->
  <path
    d="M 36,23 C 26,21 16,25 16,32 C 16,40 46,37 46,46 C 46,53 28,56 18,57"
    fill="none"
    stroke="#FFD429"
    stroke-width="5.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Subtle Center Track for Road Perspective -->
  <path
    d="M 36,23 C 26,21 16,25 16,32 C 16,40 46,37 46,46 C 46,53 28,56 18,57"
    fill="none"
    stroke="#123C2A"
    stroke-width="1.2"
    stroke-linecap="round"
    stroke-linejoin="round"
    stroke-opacity="0.85"
  />
</svg>
